<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SafeHer | Distress Protocol</title>
<script src="/js/tailwind.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#896790", // Deep Purple
                        "on-primary": "#ffffff",
                        "primary-container": "#ffe1f5", // Soft Pink
                        "on-primary-container": "#6f4f76",
                        "secondary": "#6f4f76",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#f9edfd", // Lavender
                        "on-secondary-container": "#6f4f76",
                        "background": "#1e1b1d", // Dark from system
                        "surface": "#2a2428",
                        "on-surface": "#ffe1f5",
                        "on-surface-variant": "#d2c1d4",
                        "outline": "#896790",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pulsing-alert {
            box-shadow: 0 0 40px rgba(137, 103, 144, 0.3);
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        .countdown-shadow {
            text-shadow: 0 0 30px rgba(255, 225, 245, 0.4);
        }
        .hold-progress {
            background: linear-gradient(to right, #896790 100%, transparent 100%);
            width: 0%;
            transition: width 0.1s linear;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col selection:bg-primary/30">
<!-- The TopAppBar component logic from system - integrated for UI consistency -->
<header class="flex justify-between items-center w-full px-6 py-4 sticky top-0 z-50 bg-[#1e1b1d]/80 backdrop-blur-md">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<span class="font-['Space_Grotesk'] font-black text-[#ffe1f5] tracking-widest text-xl">SAFEHER</span>
</div>
<span class="material-symbols-outlined text-[#ffe1f5] opacity-50" data-icon="verified_user">verified_user</span>
</header>
<main class="flex-grow flex flex-col px-6 pt-4 pb-8 max-w-5xl mx-auto w-full relative">
    <div class="fixed inset-0 bg-gradient-to-b from-primary/10 to-transparent pointer-events-none"></div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start relative z-10 w-full h-full">
        <!-- LEFT COLUMN: Status & Controls -->
        <div class="space-y-6 flex flex-col justify-center">
            <div class="text-center space-y-2">
                <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-error-container/40 text-error border border-error/20 font-headline font-bold text-xs tracking-widest uppercase">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-error opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-error"></span>
                    </span>
                    Distress Active
                </span>
                <h1 class="font-headline font-black text-3xl text-on-surface tracking-tight leading-tight">PROTOCOL ENGAGED</h1>
            </div>

            <div class="relative flex flex-col items-center justify-center py-4">
                <div class="relative w-48 h-48 flex items-center justify-center rounded-full border-4 border-primary/20 pulsing-alert bg-surface/60 backdrop-blur-xl">
                    <span class="font-headline font-black text-7xl text-primary-container countdown-shadow tracking-tighter">15</span>
                </div>
            </div>

            <div class="bg-surface/40 p-6 rounded-3xl space-y-4 border border-primary/10 backdrop-blur-sm">
                <div id="protocol-feed-container" class="space-y-4 max-h-[200px] overflow-y-auto">
                    <!-- Progress items will be injected here -->
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                        <span class="text-sm font-medium tracking-wide">Secure GPS Tunneling</span>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <button id="protocol-cancel-btn" class="w-full relative py-6 px-8 rounded-2xl bg-primary text-white overflow-hidden group active:scale-[0.98] transition-all shadow-xl shadow-primary/20" style="touch-action:none;user-select:none;-webkit-user-select:none;">
                    <div id="protocol-cancel-progress" class="absolute inset-0 hold-progress opacity-30 bg-red-500" style="width:0%;transition:none;"></div>
                    <div class="relative flex items-center justify-center gap-3">
                        <span class="material-symbols-outlined font-black">close</span>
                        <span class="font-headline font-black text-lg tracking-widest uppercase">Hold 3s to Cancel</span>
                    </div>
                </button>
            </div>
        </div>

        <!-- RIGHT COLUMN: Live Evidence Feed -->
        <div class="space-y-4">
            <div class="relative aspect-video md:aspect-[3/4] rounded-4xl overflow-hidden bg-black border-2 border-primary/30 shadow-2xl glow-primary group">
                <video id="protocol-cam-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <div class="absolute top-6 left-6 flex items-center gap-2 px-3 py-1.5 bg-black/60 rounded-full backdrop-blur-md border border-white/10">
                    <div class="h-2 w-2 rounded-full bg-error animate-pulse shadow-[0_0_8px_rgba(255,180,171,0.8)]"></div>
                    <span class="text-[10px] font-black uppercase text-white tracking-widest">Live Evidence Room</span>
                </div>
                <div class="absolute bottom-6 right-6 flex gap-2">
                    <div class="p-4 rounded-2xl bg-black/60 backdrop-blur-md border border-white/10 text-white/70">
                        <span class="material-symbols-outlined">recording</span>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-primary-container text-on-primary-container rounded-2xl border border-primary/20 flex items-center justify-center gap-3">
                 <span class="material-symbols-outlined text-primary">verified_user</span>
                 <span class="text-[10px] uppercase font-bold tracking-widest leading-none">AI Evidence Sync Active</span>
            </div>
        </div>
    </div>
</main>
<!-- Background Elements -->
<div class="fixed inset-0 pointer-events-none opacity-20">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary/20 via-transparent to-transparent"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script>
    // 3s Hold-to-Cancel for the distress protocol page cancel button
    window.addEventListener('load', () => {
        const btn = document.getElementById('protocol-cancel-btn');
        const prog = document.getElementById('protocol-cancel-progress');
        if (!btn) return;
        let holdTimer, holdTick, holdStart, executed = false;

        const start = (e) => {
            if (executed) return;
            if (e.cancelable) e.preventDefault();
            holdStart = Date.now();
            holdTimer = setTimeout(() => {
                if (executed) return;
                executed = true;
                clearInterval(holdTick);
                if (typeof window.stopAegisSensors === 'function') window.stopAegisSensors();
                location.href = '/';
            }, 3000);
            holdTick = setInterval(() => {
                if (!holdStart) return;
                const pct = Math.min(((Date.now() - holdStart) / 3000) * 100, 100);
                if (prog) prog.style.width = pct + '%';
            }, 30);
        };
        const end = () => {
            if (executed) return;
            clearTimeout(holdTimer);
            clearInterval(holdTick);
            holdStart = null;
            if (prog) prog.style.width = '0%';
        };
        btn.addEventListener('mousedown', start);
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('mouseup', end);
        btn.addEventListener('touchend', end);
        btn.addEventListener('mouseleave', end);
        btn.addEventListener('touchcancel', end);
    });
</script>
</body></html>
